name: ruby

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit hash of ruby/ruby to test (leave empty for latest default branch)'
        required: false
        type: string
  schedule:
    - cron: '0 19 * * *'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cygwin/cygwin-install-action@master
        with:
          platform: x86_64
          packages: cygport,git,libcrypt-devel,libedit-devel,libffi-devel,libgdbm-devel,libgmp-devel,libintl-devel,libncurses-devel,libreadline-devel,libssl-devel,libuuid-devel,libyaml-devel,ruby,ruby-devel,rubygems,subversion,tcl-tk-devel,zlib-devel
      - name: Prepare
        run: |
          export PATH=/usr/bin
          gem install fiddle
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -ex -o igncr -o pipefail '{0}'
      - name: Clone
        run: |
          export PATH=/usr/bin
          cd /cygdrive/c/cygwin/tmp
          if [ -n "$COMMIT" ]; then
            git clone --quiet https://github.com/ruby/ruby.git
            cd ruby
            git checkout --quiet "$COMMIT"
          else
            git clone --quiet --depth=1 https://github.com/ruby/ruby.git
            cd ruby
          fi
          git log --max-count=1
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -ex -o igncr -o pipefail '{0}'
        env:
          COMMIT: ${{ inputs.commit }}
      - name: Autogen
        run: |
          export PATH=/usr/bin
          cd /cygdrive/c/cygwin/tmp/ruby
          ./autogen.sh -v
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -ex -o igncr -o pipefail '{0}'
      - name: Configure
        run: |
          export PATH=/usr/bin
          cd /cygdrive/c/cygwin/tmp/ruby
          ./configure
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -ex -o igncr -o pipefail '{0}'
      - name: Build
        run: |
          export PATH=/usr/bin
          cd /cygdrive/c/cygwin/tmp/ruby
          make -j2 V=1
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -ex -o igncr -o pipefail '{0}'
      - name: Test
        run: |
          export PATH=/usr/bin
          cd /cygdrive/c/cygwin/tmp/ruby
          make test
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -ex -o igncr -o pipefail '{0}'
